name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            args: --features canon --config src-tauri/tauri.canon-windows.conf.json
          - target: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin --features canon --config src-tauri/tauri.canon-macos.conf.json
          - target: macos-x64
            os: macos-latest
            args: --target x86_64-apple-darwin --features canon --config src-tauri/tauri.canon-macos.conf.json
          - target: linux-x64
            os: ubuntu-22.04
            args: --features canon --config src-tauri/tauri.canon-linux.conf.json
          - target: linux-arm64
            os: ubuntu-22.04-arm
            args: --features canon --config src-tauri/tauri.canon-linux.conf.json

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Download Canon EDSDK
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            windows-x64)
              mkdir -p .proprietary/canon/windows/Library .proprietary/canon/windows/Dll
              gcloud storage cp gs://cameras-ci-sdk/canon/windows/Library/EDSDK.lib .proprietary/canon/windows/Library/
              gcloud storage cp gs://cameras-ci-sdk/canon/windows/Dll/EDSDK.dll .proprietary/canon/windows/Dll/
              gcloud storage cp gs://cameras-ci-sdk/canon/windows/Dll/EdsImage.dll .proprietary/canon/windows/Dll/
              ;;
            linux-x64)
              mkdir -p .proprietary/canon/linux-x64
              gcloud storage cp gs://cameras-ci-sdk/canon/linux-x64/libEDSDK.so .proprietary/canon/linux-x64/
              ;;
            linux-arm64)
              mkdir -p .proprietary/canon/linux-arm64
              gcloud storage cp gs://cameras-ci-sdk/canon/linux-arm64/libEDSDK.so .proprietary/canon/linux-arm64/
              ;;
            macos-arm64|macos-x64)
              mkdir -p .proprietary/canon/macos
              gcloud storage cp -r gs://cameras-ci-sdk/canon/macos/EDSDK.framework .proprietary/canon/macos/
              ;;
          esac

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils nasm

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y

      - name: Install NASM (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Install Rust target (macOS x64)
        if: matrix.target == 'macos-x64'
        run: rustup target add x86_64-apple-darwin

      - name: Read Node version from mise.toml
        id: node
        shell: bash
        run: echo "version=$(grep -E '^node\s*=' mise.toml | sed -E 's/.*"([^"]+)".*/\1/')" >>
          "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Install package manager (from package.json)
        shell: bash
        run: |
          npm uninstall --global yarn
          npm install --global corepack@0.36.0
          corepack enable
          corepack install

      - name: Resolve yarn cache folder
        id: yarn-config
        shell: bash
        run: echo "cacheFolder=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore yarn install cache (node_modules + cacheFolder + install-state)
        id: yarn-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            ${{ steps.yarn-config.outputs.cacheFolder }}
            .yarn/install-state.gz
          key: yarn-${{ runner.os }}-node${{ steps.node.outputs.version }}-${{
            hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-node${{ steps.node.outputs.version }}-

      - name: Install dependencies
        shell: bash
        env:
          YARN_ENABLE_HARDENED_MODE: 'false'
        run: |
          case "$(yarn --version)" in 1.*) echo 'expected up-to-date yarn version'; exit 1 ;; esac
          yarn install --immutable

      # release-please creates the release with its changelog before pushing the tag;
      # passing its id makes tauri-action upload assets without rewriting the notes.
      - name: Resolve release id
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .id)
          echo "Uploading to release ${id} for ${GITHUB_REF_NAME}"
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - name: Build and upload (release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ steps.release.outputs.id }}
          args: ${{ matrix.args }}

      - name: Build (CI)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Verify installer bundles the virtual camera (Windows)
        if: matrix.target == 'windows-x64'
        shell: bash
        run: |
          set -euo pipefail
          installer=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          listing=$(7z l "$installer")
          for file in vcam_source.dll AppxManifest.xml 'icons\icon.png'; do
            grep -qF "$file" <<<"$listing" || { echo "::error::$installer is missing $file"; exit 1; }
          done
          echo "$installer bundles vcam_source.dll, AppxManifest.xml and icons/icon.png"

      - name: Build MSIX sparse package (Windows)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: scripts/build-msix.ps1

      - name: Upload MSIX to release (Windows)
        if: ${{ matrix.target == 'windows-x64' && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: src-tauri/msix/*.msix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/msix/*.msix
          if-no-files-found: error
