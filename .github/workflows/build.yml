name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            args: --features canon --config src-tauri/tauri.canon-windows.conf.json
          - target: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin --features canon --config src-tauri/tauri.canon-macos.conf.json
          - target: macos-x64
            os: macos-latest
            args: --target x86_64-apple-darwin --features canon --config src-tauri/tauri.canon-macos.conf.json
          - target: linux-x64
            os: ubuntu-22.04
            args: --features canon --config src-tauri/tauri.canon-linux.conf.json
          - target: linux-arm64
            os: ubuntu-22.04-arm
            args: --features canon --config src-tauri/tauri.canon-linux.conf.json

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download Canon EDSDK
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            windows-x64)
              mkdir -p .proprietary/canon/windows/Library .proprietary/canon/windows/Dll
              gcloud storage cp gs://cameras-ci-sdk/canon/windows/Library/EDSDK.lib .proprietary/canon/windows/Library/
              gcloud storage cp gs://cameras-ci-sdk/canon/windows/Dll/EDSDK.dll .proprietary/canon/windows/Dll/
              gcloud storage cp gs://cameras-ci-sdk/canon/windows/Dll/EdsImage.dll .proprietary/canon/windows/Dll/
              ;;
            linux-x64)
              mkdir -p .proprietary/canon/linux-x64
              gcloud storage cp gs://cameras-ci-sdk/canon/linux-x64/libEDSDK.so .proprietary/canon/linux-x64/
              ;;
            linux-arm64)
              mkdir -p .proprietary/canon/linux-arm64
              gcloud storage cp gs://cameras-ci-sdk/canon/linux-arm64/libEDSDK.so .proprietary/canon/linux-arm64/
              ;;
            macos-arm64|macos-x64)
              mkdir -p .proprietary/canon/macos
              gcloud storage cp -r gs://cameras-ci-sdk/canon/macos/EDSDK.framework .proprietary/canon/macos/
              ;;
          esac

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Rust target (macOS x64)
        if: matrix.target == 'macos-x64'
        run: rustup target add x86_64-apple-darwin

      - name: Read Node version from mise.toml
        id: node
        shell: bash
        run:
          echo "version=$(grep -E '^node\s*=' mise.toml | sed -E 's/.*"([^"]+)".*/\1/')" >>
          "$GITHUB_OUTPUT"

      - name: Install package manager (from package.json)
        if: runner.os != 'Windows'
        run: |
          corepack enable
          corepack install

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Install package manager (Windows)
        if: runner.os == 'Windows'
        run: |
          corepack enable
          corepack install

      - name: Resolve yarn cache folder
        id: yarn-config
        shell: bash
        run: echo "cacheFolder=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore yarn install cache (node_modules + cacheFolder + install-state)
        id: yarn-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ${{ steps.yarn-config.outputs.cacheFolder }}
            .yarn/install-state.gz
          key:
            yarn-${{ runner.os }}-node${{ steps.node.outputs.version }}-${{
            hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-node${{ steps.node.outputs.version }}-

      - name: Install dependencies
        shell: bash
        env:
          YARN_ENABLE_HARDENED_MODE: 'false'
        run: |
          case "$(yarn --version)" in 1.*) echo 'expected up-to-date yarn version'; exit 1 ;; esac
          yarn install --immutable

      - name: Build and upload (release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          args: ${{ matrix.args }}

      - name: Build (CI)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error
